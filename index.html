<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec">
<meta name="description" content="按你的真实课表和教学大纲，算出今天该做什么。">
<title>今天做什么</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --paper:#f6f3ec; --paper-2:#fffdf8; --ink:#1b1a17; --ink-2:#5c5850;
  --ink-3:#8d887d; --line:#e2ddd0; --line-2:#efeade;
  --red:#b5342a; --green:#2f6b4f; --amber:#a86a1f; --blue:#1f5fa8;
  --shadow:0 1px 2px rgba(27,26,23,.06), 0 8px 24px -12px rgba(27,26,23,.18);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#16150f; --paper-2:#1e1c16; --ink:#f2eee4; --ink-2:#bdb6a8;
    --ink-3:#8a8477; --line:#332f26; --line-2:#2a271f;
    --red:#e2695c; --green:#6bbd94; --amber:#d6a25a; --blue:#7aa9e0;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
.serif{font-family:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif}
.app{max-width:480px;margin:0 auto;padding:0 18px}

/* ---------- 顶栏 ---------- */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 0 12px}
.date{font-size:27px;line-height:1.15;letter-spacing:-.5px;font-weight:600}
.date .wd{font-size:15px;color:var(--ink-2);font-weight:400;margin-left:6px;letter-spacing:0}
.sub{color:var(--ink-3);font-size:12.5px;margin-top:5px}
.sub b{color:var(--red);font-weight:600}
.daynav{display:flex;gap:6px;flex-shrink:0;padding-bottom:4px}
.daynav button{
  width:34px;height:34px;border-radius:11px;border:1px solid var(--line);
  background:var(--paper-2);color:var(--ink-2);font-size:16px;line-height:1;cursor:pointer;
}
.daynav button:active{background:var(--line-2)}

/* ---------- 通用 ---------- */
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.banner{margin-top:16px;border-color:color-mix(in srgb,var(--amber) 34%,var(--line))}
.card.banner .bd{padding:14px 15px 11px;font-size:13px;line-height:1.7;color:var(--ink-2)}
.card.banner .bd b{color:var(--ink)}
.grp.backlog{background:transparent;border-style:dashed}

/* ---------- 拍照 / 打字加作业 ---------- */
.shotbar{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.shot{flex:1 1 0;min-width:0;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--paper-2);
  color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);text-align:left}
.shot:active{background:var(--line-2)}
.shot small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3);margin-top:3px}
.ta{width:100%;box-sizing:border-box;margin-top:4px;padding:11px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:15px;
  line-height:1.55;resize:vertical;min-height:78px}
.ta:focus{outline:none;border-color:var(--ink-3)}
.prev{margin-top:10px}
.prevrow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;padding:8px 0;
  border-top:1px dashed var(--line);font-size:13px}
.prevrow b{font-weight:600}
.prevrow span{flex:1 1 120px;min-width:0}
.prevrow em{font-style:normal;font-size:12px;color:var(--ink-3)}
.backdrop{position:fixed;inset:0;background:rgba(20,18,14,.44);opacity:0;pointer-events:none;
  transition:opacity .2s ease;z-index:30}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:88vh;overflow:auto;
  transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  background:var(--paper-2);border-radius:20px 20px 0 0;
  box-shadow:0 -12px 40px -16px rgba(0,0,0,.45);
  padding:10px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.sheet:before{content:"";display:block;width:38px;height:4px;border-radius:99px;background:var(--line);margin:2px auto 8px}
.sheet h3{margin:6px 0 4px;font-size:16.5px;line-height:1.4}
.sheet .sub{color:var(--ink-3);font-size:12.5px;margin-bottom:6px;line-height:1.6}
.sheet label{display:block;font-size:12px;color:var(--ink-3);margin:13px 0 5px}
.sheet input,.sheet select{width:100%;padding:11px;border-radius:11px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font:inherit;font-size:15px}
.sheet .row2{display:flex;gap:10px}
.sheet .row2>div{flex:1;min-width:0}
.hwrow .row2>div>input{width:100%;box-sizing:border-box}
.hwrow .row2>div[data-w=date]{flex:1.2}
.hwrow .row2>div[data-w=time]{flex:1}
.hwrow .row2>div[data-w=min]{flex:.7}
.sheet .warn{background:color-mix(in srgb,var(--amber) 13%,transparent);
  border:1px solid color-mix(in srgb,var(--amber) 32%,transparent);color:var(--ink-2);
  border-radius:11px;padding:10px 12px;font-size:12.5px;line-height:1.65;margin-top:13px}
.sheet .acts{display:flex;gap:10px;margin-top:16px}
.sheet .acts button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.sheet .acts button.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sheet details{margin-top:13px;font-size:12.5px;color:var(--ink-3)}
.sheet details summary{cursor:pointer}
.sheet details pre{white-space:pre-wrap;word-break:break-word;margin:7px 0 0;
  font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;background:var(--paper);
  border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink-2)}
.sheet .thumb{max-height:160px;border-radius:12px;border:1px solid var(--line);margin-top:10px;display:block}
/* 确认卡里的多条作业：一条一张小卡 */
.hwrow{border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin:10px 0 0;background:var(--paper)}
.hwr{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.hwr .idx{font:600 11.5px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--ink-3);
  border:1px solid var(--line);border-radius:6px;padding:3px 5px;flex:none}
.hwr select{margin:0;flex:1;min-width:0;padding:8px 10px;font-size:13.5px}
.hwr .del{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink-3);
  border-radius:9px;padding:6px 9px;font-size:13px;line-height:1;cursor:pointer}
.hwrow input[data-f=title]{margin:0 0 9px;font-size:14.5px;padding:10px}
.hwrow .row2>div>label{display:block;font-size:11.5px;color:var(--ink-3);margin:0 0 4px}
.hwrow .row2 input{padding:9px;font-size:13.5px}
.h{margin:26px 0 10px;font-size:12px;letter-spacing:.14em;color:var(--ink-3);font-weight:600}
.h .n{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  display:inline-flex;align-items:baseline;gap:6px;padding:6px 11px;border-radius:999px;
  background:var(--paper-2);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;
}
.chip i{width:7px;height:7px;border-radius:50%;flex-shrink:0;transform:translateY(-1px)}
.chip.done{opacity:.5;text-decoration:line-through}
.chip small{color:var(--ink-3);font-size:11.5px}

/* ---------- 今日必做 ---------- */
.top{margin-top:4px;overflow:hidden}
.top-hd{display:flex;align-items:baseline;justify-content:space-between;padding:15px 17px 11px;border-bottom:1px solid var(--line-2)}
.top-hd h2{margin:0;font-size:15.5px;letter-spacing:.02em}
.top-hd span{font-size:12px;color:var(--ink-3)}
.todo{display:flex;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line-2);align-items:flex-start;cursor:pointer}
.todo:last-child{border-bottom:0}
.todo:active{background:var(--line-2)}
.rank{
  font-family:"Songti SC",Georgia,serif;font-size:20px;line-height:1.15;color:var(--red);
  width:22px;flex-shrink:0;text-align:center;font-variant-numeric:tabular-nums;
}
.todo.done .rank{color:var(--ink-3)}
.body{flex:1;min-width:0}
.tt{font-weight:600;font-size:14.6px;line-height:1.45;word-break:break-word}
.todo.done .tt{color:var(--ink-3);text-decoration:line-through}
.why{font-size:12.4px;color:var(--ink-2);margin-top:3px;line-height:1.5}
.meta{font-size:11.5px;color:var(--ink-3);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.meta .tag{padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--ink-3)}
.tag.hot{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.tag.warm{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 35%,transparent)}
.box{
  width:26px;height:26px;border-radius:9px;border:1.6px solid var(--line);flex-shrink:0;
  display:grid;place-items:center;margin-top:1px;background:transparent;color:transparent;font-size:14px;
  transition:transform .12s ease;
}
.todo:active .box{transform:scale(.92)}
.todo.done .box{background:var(--green);border-color:var(--green);color:#fff}

/* 勾选后的二次确认条：防误触 */
.todo.pend{background:color-mix(in srgb,var(--red) 7%,transparent);border-bottom:0}
.todo.pend .box{border-color:var(--red);color:var(--red);background:transparent}
.confirm{
  display:flex;gap:8px;flex-wrap:wrap;padding:0 15px 13px;
  background:color-mix(in srgb,var(--red) 7%,transparent);border-bottom:1px solid var(--line-2);
}
.confirm .q{flex:1 1 100%;font-size:12.4px;color:var(--ink-2);margin:0 0 1px}
.confirm button.b{flex:1 1 0;min-width:0;padding:9px 0;font-size:13.5px}

/* 作业台账 */
.todo.hw .tt{font-size:14.2px}
.cdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle}
.hwcard{margin-bottom:15px}

/* ---------- 分组清单 ---------- */
details.grp{border:1px solid var(--line);border-radius:13px;background:var(--paper-2);margin-bottom:9px;overflow:hidden}
details.grp>summary{
  list-style:none;padding:12px 14px;display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13.6px;
}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .cnt{margin-left:auto;color:var(--ink-3);font-size:12px}
details.grp[open]>summary{border-bottom:1px solid var(--line-2)}
.li{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-2);align-items:flex-start;cursor:pointer}
.li:last-child{border-bottom:0}
.li .box{width:22px;height:22px;border-radius:8px;font-size:12px}
.li .tt{font-size:13.6px;font-weight:500}
.li .why{font-size:12px}

/* ---------- 空态 ---------- */
.empty{padding:26px 18px;text-align:center;color:var(--ink-2);font-size:13.5px}
.empty .big{font-size:15px;color:var(--ink);margin-bottom:6px;font-weight:600}

/* ---------- 进度 ---------- */
.row{padding:14px 15px;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.row-hd{display:flex;align-items:center;gap:8px}
.row-hd .nm{font-weight:600;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--ink-3);flex-shrink:0}
.badge.bad{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 30%,transparent)}
.badge.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 30%,transparent)}
.bar{height:5px;border-radius:99px;background:var(--line-2);margin-top:9px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--green);transition:width .3s ease}
.row .now{font-size:12.2px;color:var(--ink-2);margin-top:7px}
.row .now b{color:var(--ink);font-weight:600}

/* ---------- 设置 ---------- */
.field{padding:13px 15px;border-bottom:1px solid var(--line-2)}
.field:last-child{border-bottom:0}
.field label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:6px}
.field input,.field select{
  width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-size:14px;font-family:inherit;
}
.hint{font-size:11.8px;color:var(--ink-3);margin-top:7px;line-height:1.55}
.btns{display:flex;gap:8px;flex-wrap:wrap;padding:13px 15px}
button.b{
  flex:1 1 auto;min-width:104px;padding:11px 13px;border-radius:11px;border:1px solid var(--line);
  background:var(--paper-2);color:var(--ink);font-size:13.5px;font-family:inherit;cursor:pointer;
}
button.b:active{background:var(--line-2)}
button.b.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
button.b.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.hw{display:flex;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line-2);font-size:13px;align-items:baseline}
.hw:last-child{border-bottom:0}
.hw .x{margin-left:auto;color:var(--ink-3);font-size:12px;flex-shrink:0;cursor:pointer;padding:0 4px}

/* ---------- 底栏 ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(160%) blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabs .in{display:flex;width:100%;max-width:480px;margin:0 auto}
.tabs button{
  flex:1;padding:12px 0 13px;background:none;border:0;color:var(--ink-3);
  font-size:12.5px;font-family:inherit;cursor:pointer;position:relative;
}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs button.on::after{
  content:"";position:absolute;left:50%;top:4px;transform:translateX(-50%);
  width:18px;height:2.5px;border-radius:2px;background:var(--red);
}
.toast{
  position:fixed;left:50%;bottom:84px;transform:translate(-50%,10px);opacity:0;
  background:var(--ink);color:var(--paper);padding:9px 15px;border-radius:11px;font-size:13px;
  pointer-events:none;transition:.22s ease;z-index:20;max-width:80vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{color:var(--ink-3);font-size:11.5px;text-align:center;padding:22px 8px 8px;line-height:1.7}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div>
      <div class="date" id="hdrDate">今天</div>
      <div class="sub" id="hdrSub"></div>
    </div>
    <div class="daynav">
      <button id="prevDay" aria-label="前一天">‹</button>
      <button id="nextDay" aria-label="后一天">›</button>
    </div>
  </header>
  <main id="view"></main>
  <footer class="foot" id="foot"></footer>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div id="sheetIn"></div></div>
<input type="file" id="shotInput" accept="image/*" style="display:none">
<nav class="tabs"><div class="in">
  <button data-tab="today" class="on">今日</button>
  <button data-tab="progress">进度</button>
  <button data-tab="settings">设置</button>
</div></nav>
<div class="toast" id="toast"></div>
<script src="rules.js?v=14"></script>
<script src="seed.js?v=14"></script>
<script src="parse.js?v=14"></script>
<script src="app.js?v=14"></script>
</body>
</html>
